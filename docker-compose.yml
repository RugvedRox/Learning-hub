version: '3.8'\n\nservices:\n  mongodb:\n    image: mongo:5.0\n    container_name: learning-hub-mongo\n    ports:\n      - \"27017:27017\"\n    environment:\n      MONGO_INITDB_ROOT_USERNAME: root\n      MONGO_INITDB_ROOT_PASSWORD: password\n    volumes:\n      - mongodb_data:/data/db\n    networks:\n      - learning-hub-network\n\n  backend:\n    build:\n      context: ./backend\n      dockerfile: Dockerfile\n    container_name: learning-hub-backend\n    ports:\n      - \"5000:5000\"\n    environment:\n      MONGODB_URI: mongodb://root:password@mongodb:27017/learning-hub\n      JWT_SECRET: your_jwt_secret_key\n      OPENAI_API_KEY: ${OPENAI_API_KEY}\n      NODE_ENV: development\n    depends_on:\n      - mongodb\n    networks:\n      - learning-hub-network\n    volumes:\n      - ./backend:/app\n      - /app/node_modules\n\n  frontend:\n    build:\n      context: ./frontend\n      dockerfile: Dockerfile\n    container_name: learning-hub-frontend\n    ports:\n      - \"3000:3000\"\n    environment:\n      REACT_APP_API_URL: http://localhost:5000\n      REACT_APP_ENV: development\n    depends_on:\n      - backend\n    networks:\n      - learning-hub-network\n    volumes:\n      - ./frontend:/app\n      - /app/node_modules\n\nvolumes:\n  mongodb_data:\n\nnetworks:\n  learning-hub-network:\n    driver: bridge\n